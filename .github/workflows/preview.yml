# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish Preview
run-name: '[Preview] PR #${{ inputs.pr }}'

# Manual only: nuget.org versions are permanent, so a preview is published when a
# maintainer asks for one (Actions → Publish Preview → Run workflow), not on every push.
# Run it from the default branch so the trusted workflow file, not the PR's copy of it,
# holds the NuGet publishing rights.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to publish a preview package for'
        required: true
        type: number

concurrency:
  group: preview-${{ inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      # Only open PRs from branches in this repository: fork code is never published
      # under the Facet package IDs.
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number('${{ inputs.pr }}'),
            });
            if (pr.state !== 'open') {
              core.setFailed(`PR #${pr.number} is ${pr.state}; previews are only published for open PRs.`);
              return;
            }
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(`PR #${pr.number} comes from a fork; previews are only published for branches in this repository.`);
              return;
            }
            core.setOutput('sha', pr.head.sha);
            core.info(`Publishing PR #${pr.number} "${pr.title}" at ${pr.head.sha}`);

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Read base version from Directory.Build.props
        id: base_version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Base version: $VERSION"

      - name: Compute preview version
        id: preview_version
        shell: bash
        run: |
          PREVIEW_VERSION="${{ steps.base_version.outputs.VERSION }}-preview.pr${{ inputs.pr }}.${{ github.run_number }}"
          echo "PREVIEW_VERSION=$PREVIEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Preview version: $PREVIEW_VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.preview_version.outputs.PREVIEW_VERSION }}

      - name: Pack NuGet packages
        run: dotnet pack --configuration Release --no-build -p:Version=${{ steps.preview_version.outputs.PREVIEW_VERSION }} --output ./artifacts

      - name: List generated packages
        run: Get-ChildItem ./artifacts | Select-Object Name | Format-Table

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish preview packages to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Comment preview version on PR
        uses: actions/github-script@v9
        with:
          script: |
            const issue_number = Number('${{ inputs.pr }}');
            const version = '${{ steps.preview_version.outputs.PREVIEW_VERSION }}';
            const body = [
              '## 📦 Preview packages published',
              '',
              `Version: \`${version}\``,
              '',
              'Install with:',
              '```',
              `dotnet add package Facet --version ${version}`,
              '```',
              '',
              '_Published manually from this PR. Run the **Publish Preview** workflow again to publish a newer preview; earlier versions stay on NuGet._',
            ].join('\n');

            // Update existing bot comment if present, otherwise create a new one
            const { data: comments } = await github.rest.issues.listComments({
              issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Preview packages published')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
