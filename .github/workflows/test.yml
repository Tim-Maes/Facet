# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: test
run-name: '[Test] ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}'
# No workflow_run trigger: it runs in the base repository's context (secrets, write token)
# and would build fork PR code there. pull_request runs fork code with a read-only token.
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "master"

permissions:
  contents: read
  checks: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/*.trx
          retention-days: 7

      # Fork PRs get a read-only token, so creating the check run would fail; the .trx
      # artifact above still carries their results.
      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: >-
          (success() || failure()) &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Unit Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}
